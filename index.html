<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu ticket dorado | mirna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;600&display=swap" rel="stylesheet">
<style>
  :root {
    --noche: #0a0e54;
    --noche-profundo: #04061f;
    --rosa: #e5197d;
    --blanco: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; }

  html { background: var(--noche-profundo); }

  body {
    min-height: 100vh;
    font-family: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--blanco);
    background: linear-gradient(180deg, var(--noche) 0%, #070a3a 45%, var(--noche-profundo) 100%);
    display: grid;
    place-items: center;
    padding: 48px 20px 40px;
    position: relative;
    overflow-x: hidden;
  }

  /* Sala: butacas apenas insinuadas al fondo */
  body::before {
    content: "";
    position: fixed;
    inset: 45vh 0 0 0;
    background-image: url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27210%27 height=%27180%27 viewBox=%270 0 210 180%27%3E%0A%3Cdefs%3E%0A%3ClinearGradient id=%27g%27 x1=%270%27 y1=%270%27 x2=%270%27 y2=%271%27%3E%3Cstop offset=%270%27 stop-color=%27%23a3162b%27/%3E%3Cstop offset=%271%27 stop-color=%27%234a0611%27/%3E%3C/linearGradient%3E%0A%3CradialGradient id=%27h%27 cx=%27.5%27 cy=%27.2%27 r=%27.6%27%3E%3Cstop offset=%270%27 stop-color=%27%23ffffff%27 stop-opacity=%27.22%27/%3E%3Cstop offset=%271%27 stop-color=%27%23ffffff%27 stop-opacity=%270%27/%3E%3C/radialGradient%3E%0A%3C/defs%3E%0A%3Crect width=%27210%27 height=%27180%27 fill=%27%231a0408%27/%3E%0A%3Crect x=%2710%27 y=%2796%27 width=%2720%27 height=%2784%27 rx=%278%27 fill=%27%232c060d%27/%3E%0A%3Crect x=%27180%27 y=%2796%27 width=%2720%27 height=%2784%27 rx=%278%27 fill=%27%232c060d%27/%3E%0A%3Cpath d=%27M32 180 V66 Q32 20 105 20 Q178 20 178 66 V180 Z%27 fill=%27url%28%23g%29%27/%3E%0A%3Cpath d=%27M32 180 V66 Q32 20 105 20 Q178 20 178 66 V180 Z%27 fill=%27url%28%23h%29%27/%3E%0A%3C/svg%3E");
    background-size: 210px 180px;
    filter: blur(5px) brightness(.5);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 60%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 60%);
    z-index: 0;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, rgba(4, 6, 31, 0) 25%, rgba(4, 6, 31, .75) 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* Focos: un velo de luz muy suave, sin bordes marcados */
  .foco {
    position: fixed;
    top: -40px;
    width: min(40vw, 320px);
    height: 55vh;
    background: linear-gradient(180deg, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 90%);
    clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    filter: blur(22px);
    z-index: 0;
    pointer-events: none;
  }
  .foco.izq { left: 4vw; transform: rotate(10deg); transform-origin: 50% 0; }
  .foco.der { right: 4vw; transform: rotate(-10deg); transform-origin: 50% 0; }

  .premio {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 580px;
    text-align: center;
  }

  /* Titular: firme arriba, fino abajo, como "El gran / estreno" pero contenido */
  h1 { line-height: 1.05; }

  h1 .fuerte {
    display: block;
    font-weight: 600;
    font-size: clamp(1.9rem, 7vw, 2.8rem);
    letter-spacing: .06em;
    text-transform: uppercase;
    padding-left: .06em;
  }

  h1 .fino {
    display: block;
    margin-top: 4px;
    font-weight: 200;
    font-size: clamp(1.5rem, 5.5vw, 2.2rem);
    letter-spacing: .32em;
    text-transform: uppercase;
    padding-left: .32em;
  }

  .etiquetas {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .etiqueta {
    padding: 6px 16px;
    border: 1px solid rgba(229, 25, 125, .85);
    border-radius: 999px;
    background: rgba(10, 14, 84, .7);
    font-weight: 300;
    font-size: .85rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .etiqueta[hidden] { display: none; }

  .ticket {
    margin: 32px auto 28px;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
    isolation: isolate;
    box-shadow:
      0 0 0 1px rgba(232, 195, 90, .35),
      0 20px 40px rgba(0, 0, 0, .5);
  }

  .ticket img { display: block; width: 100%; height: auto; }

  /* Destello dorado que recorre el ticket */
  .ticket::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: -35%;
    left: -45%;
    width: 24%;
    height: 170%;
    pointer-events: none;
    background: linear-gradient(90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 248, 210, .12) 25%,
      rgba(255, 255, 255, .9) 50%,
      rgba(255, 225, 120, .2) 72%,
      rgba(255, 255, 255, 0) 100%
    );
    filter: blur(5px);
    transform: skewX(-18deg);
    animation: brillo-ticket 3.2s ease-in-out infinite;
  }

  @keyframes brillo-ticket {
    0%, 15% { left: -45%; opacity: 0; }
    22% { opacity: .95; }
    48% { left: 120%; opacity: .9; }
    55%, 100% { left: 120%; opacity: 0; }
  }

  .detalle {
    max-width: 34ch;
    margin: 0 auto;
    font-weight: 300;
    font-size: clamp(1.05rem, 3.4vw, 1.25rem);
    line-height: 1.4;
  }

  .detalle strong { font-weight: 600; }

  .boton {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 34px;
    border-radius: 999px;
    background: var(--rosa);
    color: var(--blanco);
    font: 600 1rem "Outfit", system-ui, sans-serif;
    text-decoration: none;
    transition: background .15s ease;
  }

  .boton:hover { background: #c9146b; }
  .boton:focus-visible { outline: 2px solid var(--blanco); outline-offset: 4px; }

  .marca { margin-top: 40px; }
  .marca img { display: block; width: 112px; height: auto; margin: 0 auto; }
  .marca p { margin-top: 6px; font-weight: 200; font-size: .95rem; letter-spacing: .04em; }

  .legal {
    margin-top: 20px;
    font-weight: 300;
    font-size: .78rem;
    color: rgba(255, 255, 255, .6);
  }

  @media (prefers-reduced-motion: reduce) {
    .boton { transition: none; }
    .ticket::after { animation: none; opacity: 0; }
  }
</style>
</head>

  const params = new URLSearchParams(location.search);
  const nombre = params.get("nombre");
  const codigo = params.get("codigo");

  if (nombre) {
    document.getElementById("etiqueta-nombre").textContent = "Felicidades, " + nombre;
  }

  if (codigo) {
    const el = document.getElementById("etiqueta-codigo");
    el.textContent = "Código " + codigo;
    el.hidden = false;
  }

  // Cambia este enlace por el de tu tienda en línea.
  document.getElementById("cta").href = "https://www.almacenesmirna.com.ec/";
</script>
